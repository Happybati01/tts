<!DOCTYPE html>
<html><body style="max-width:600px;margin:40px auto;font-family:sans-serif">
<h2>🔊 My TTS - Vercel</h2>
<textarea id=t style="width:100%;height:150px"></textarea>
<select id=v style="width:100%;padding:10px;margin-top:10px">
<option value="en-IN-NeerjaNeural">Neerja IN</option>
<option value="en-US-AriaNeural">Aria US</option>
</select>
<button onclick="go()" style="width:100%;padding:12px;margin-top:10px;background:#000;color:#fff">Generate</button>
<audio id=a controls style="width:100%;margin-top:20px"></audio>
<script>
async function go(){
 let text=t.value, voice=v.value;
 let r=await fetch(`/api/tts?text=${encodeURIComponent(text)}&voice=${voice}`);
 let b=await r.blob(); a.src=URL.createObjectURL(b); a.play();
}
</script>
</body></html>
